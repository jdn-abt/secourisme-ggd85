<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B1E3D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Secourisme GGD85" />
  <title>Cellule Secourisme GGD85 — Aide au Formateur</title>
  <link id="dynamic-favicon" rel="icon" type="image/png" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" />
  <link id="dynamic-manifest" rel="manifest" />
  <style>
    :root {
      --bg-app: #090D16;
      --bg-surface: #111827;
      --bg-card: #161F30;
      --bg-card-hover: #1D283D;
      --bg-input: #0D1320;
      --border: #26334D;
      --border-light: #334366;
      --navy: #0B1E3D;
      --navy-accent: #1E3A8A;
      --blue: #3B82F6;
      --blue-soft: rgba(59, 130, 246, 0.16);
      --gold: #EAB308;
      --gold-soft: rgba(234, 179, 8, 0.16);
      --red: #EF4444;
      --red-dark: #DC2626;
      --red-soft: rgba(239, 68, 68, 0.16);
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.16);
      --amber: #F59E0B;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --purple: #A855F7;
      --purple-soft: rgba(168, 85, 247, 0.16);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, #09172E 0%, #10284E 100%);
      border-bottom: 1px solid rgba(234, 179, 8, 0.28);
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .header-inner {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .rondache-box {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.55);
      background: #161616;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rondache-box svg, .rondache-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-text { min-width: 0; }
    .brand-kicker {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 12px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
    }
    .sync-pill.online .sync-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .sync-pill.online { color: #86EFAC; border-color: rgba(34, 197, 94, 0.35); }
    .sync-pill.error .sync-dot { background: var(--red); }
    .sync-pill.error { color: #FCA5A5; border-color: rgba(239, 68, 68, 0.35); }

    .role-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .role-admin { background: var(--gold-soft); color: #FDE047; border: 1px solid rgba(234, 179, 8, 0.45); }
    .role-referent { background: var(--purple-soft); color: #D8B4FE; border: 1px solid rgba(168, 85, 247, 0.45); }
    .role-user { background: var(--blue-soft); color: #93C5FD; border: 1px solid rgba(59, 130, 246, 0.35); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    /* Desktop Top Nav */
    .desktop-nav {
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
    }
    .desktop-nav-inner {
      max-width: 1060px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 768px) {
      .desktop-nav { display: block; }
      .mobile-nav { display: none !important; }
      .main-container { padding-bottom: 32px !important; }
    }

    /* Mobile Bottom Nav */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(13, 19, 32, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      gap: 4px;
    }
    .nav-btn {
      position: relative;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 11px;
      padding: 7px 4px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .desktop-nav .nav-btn {
      flex-direction: row;
      padding: 10px 12px;
      font-size: 13.5px;
      gap: 8px;
    }
    .nav-btn.active {
      background: rgba(30, 58, 138, 0.45);
      border-color: rgba(59, 130, 246, 0.45);
      color: #FFFFFF;
    }
    .nav-badge {
      position: absolute;
      top: 4px;
      right: 14px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .desktop-nav .nav-badge { position: static; }
    .badge-red { background: var(--red); color: #fff; }
    .badge-green { background: var(--green); color: #052e16; animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    /* Main Layout */
    .main-container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 16px 14px 92px;
    }
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .page-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .page-desc {
      margin: 3px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover { background: var(--bg-card-hover); }
    .btn:active { transform: scale(0.98); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-primary { background: var(--navy-accent); border-color: #3B82F6; color: #fff; }
    .btn-primary:hover { background: #254EDB; }
    .btn-danger { background: var(--red-dark); border-color: #F87171; color: #fff; }
    .btn-danger:hover { background: #B91C1C; }
    .btn-success { background: #15803D; border-color: #4ADE80; color: #fff; }
    .btn-success:hover { background: #166534; }
    .btn-amber { background: #B45309; border-color: #FBBF24; color: #fff; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }

    /* Cards & Accordions */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 14px;
    }
    .chip {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip.active {
      background: var(--navy-accent);
      border-color: var(--blue);
      color: #fff;
    }
    .chip.chip-alert.active {
      background: var(--red-dark);
      border-color: #FCA5A5;
      color: #fff;
    }

    /* Master Lots & Sub-lots */
    .master-lot {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .master-header-bar {
      background: linear-gradient(90deg, rgba(11,30,61,0.9), rgba(22,31,48,0.95));
      border-bottom: 1px solid var(--border);
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .master-toggle-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      cursor: pointer;
      flex: 1;
      min-width: 180px;
    }
    .sector-pill {
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: var(--blue-soft);
      color: #93C5FD;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .master-name { font-size: 17px; font-weight: 800; }
    .master-body { padding: 12px; }
    .sublot-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 720px) {
      .sublot-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .sublot-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .sublot-card.has-alert { border-color: rgba(239, 68, 68, 0.55); }
    .sublot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .sublot-title { font-size: 15.5px; font-weight: 800; margin: 0; }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .status-badge {
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .status-badge.readonly { cursor: default; opacity: 0.92; }
    .st-ready { background: var(--green-soft); color: #86EFAC; border-color: rgba(34, 197, 94, 0.35); }
    .st-incomplete { background: var(--red-soft); color: #FCA5A5; border-color: rgba(239, 68, 68, 0.4); }
    .st-avail { background: var(--blue-soft); color: #93C5FD; border-color: rgba(59, 130, 246, 0.35); }
    .st-reserved { background: var(--amber-soft); color: #FCD34D; border-color: rgba(245, 158, 11, 0.4); }
    .req-card {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .req-status-pending { background: var(--amber-soft); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.4); }
    .req-status-approved { background: var(--green-soft); color: #86EFAC; border: 1px solid rgba(34, 197, 94, 0.35); }
    .req-status-rejected { background: var(--red-soft); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .user-notif-banner {
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .alert-box {
      background: rgba(239, 68, 68, 0.11);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #FECACA;
    }
    .info-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.38);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: #BBF7D0;
    }
    .alert-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
    }
    .sublot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    /* Pedagogy Sub-tabs (Zero overlap 3-col grid) */
    .ped-subtabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 16px;
    }
    .ped-subtab {
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      border-radius: 9px;
      padding: 9px 6px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      line-height: 1.2;
      word-break: break-word;
    }
    .ped-subtab.active {
      background: var(--navy-accent);
      border-color: var(--blue);
      color: #fff;
    }
    .inline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      background: rgba(255,255,255,0.16);
      color: #fff;
      flex-shrink: 0;
    }

    /* Sticky Chrono in Conduite MES */
    .chrono-sticky {
      position: sticky;
      top: 72px;
      z-index: 30;
      background: linear-gradient(135deg, #0D1E3A 0%, #16233B 100%);
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: var(--radius);
      padding: 13px;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    }
    .chrono-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #FFFFFF;
    }
    .chrono-display.running { color: #4ADE80; }
    .top-chrono-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .top-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-light);
      color: #E2E8F0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Forms */
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="url"], select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 11px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 11px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    textarea { min-height: 76px; resize: vertical; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(3, 7, 18, 0.78);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.65);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { margin: 0; font-size: 17px; font-weight: 800; }

    /* Auth Gate (Supabase Login) */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: radial-gradient(circle at top, #10284E 0%, #090D16 72%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid rgba(234, 179, 8, 0.35);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }
    .auth-logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 95;
      background: #1E293B;
      border: 1px solid var(--blue);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .hidden { display: none !important; }
    .muted { color: var(--text-muted); font-size: 12.5px; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(148, 163, 184, 0.14);
      color: #CBD5E1;
    }
  </style>
</head>

      function normalizeSharedState(raw) {
        var base = createDefaultSharedData();
        var merged = Object.assign(base, raw || {});
        if (!Array.isArray(merged.users)) merged.users = base.users.slice();
        if (!Array.isArray(merged.masterLots)) merged.masterLots = base.masterLots.slice();
        if (!Array.isArray(merged.alerts)) merged.alerts = [];
        if (!Array.isArray(merged.reservationRequests)) merged.reservationRequests = [];
        if (!merged.mailConfig || typeof merged.mailConfig !== "object") {
          merged.mailConfig = { webhookUrl: "", senderLabel: "Cellule Secourisme GGD85" };
        }
        if (!Array.isArray(merged.sites)) merged.sites = base.sites.slice();

        var hasPrimary = merged.users.some(function (u) {
          return (u.email || "").toLowerCase() === PRIMARY_ADMIN_EMAIL.toLowerCase();
        });
        if (!hasPrimary) {
          merged.users.unshift({
            id: "usr-admin-1",
            email: PRIMARY_ADMIN_EMAIL,
            name: "Administrateur Cellule GGD85",
            role: "admin",
            active: true,
            createdAt: new Date().toISOString()
          });
        }
        return merged;
      }

      sharedState = normalizeSharedState(sharedState);

      function getCurrentEmail() {
        if (currentUser && currentUser.email) return currentUser.email.toLowerCase().trim();
        if (verifiedTrainer && verifiedTrainer.email) return verifiedTrainer.email.toLowerCase().trim();
        return "";
      }

      function getCurrentUserRecord() {
        var email = getCurrentEmail();
        if (!email) return null;
        return (sharedState.users || []).find(function (u) {
          return (u.email || "").toLowerCase().trim() === email;
        }) || null;
      }

      function getCurrentRole() {
        var email = getCurrentEmail();
        if (!email) return "user";
        if (email === PRIMARY_ADMIN_EMAIL.toLowerCase()) return "admin";
        var rec = getCurrentUserRecord();
        if (rec && rec.role) return rec.role;
        if (currentUser && currentUser.user_metadata && currentUser.user_metadata.role) {
          return currentUser.user_metadata.role;
        }
        if (verifiedTrainer && verifiedTrainer.role) {
          return verifiedTrainer.role;
        }
        return "user";
      }

      function isUserSuspended() {
        var email = getCurrentEmail();
        if (!email || email === PRIMARY_ADMIN_EMAIL.toLowerCase()) return false;
        var rec = getCurrentUserRecord();
        return Boolean(rec && rec.active === false);
      }

      function canManageUsers() {
        return getCurrentRole() === "admin" && !isUserSuspended();
      }

      function canManageLotsAndSites() {
        var r = getCurrentRole();
        return (r === "admin" || r === "referent") && !isUserSuspended();
      }

      function canReportAlert() {
        return !isUserSuspended();
      }

      function getRoleLabel(role) {
        if (role === "admin") return "Administrateur";
        if (role === "referent") return "Référent";
        return "Utilisateur";
      }

      function getRoleBadgeHtml(role) {
        if (role === "admin") return '<span class="role-badge role-admin">Administrateur</span>';
        if (role === "referent") return '<span class="role-badge role-referent">Référent</span>';
        return '<span class="role-badge role-user">Utilisateur</span>';
      }

      function loadVerifiedTrainer() {
        try {
          var raw = localStorage.getItem(VERIFIED_USER_KEY);
          if (!raw) return null;
          var parsed = JSON.parse(raw);
          if (parsed && parsed.email) return parsed;
        } catch (e) {}
        return null;
      }

      function saveVerifiedTrainer(user) {
        if (!user || !user.email) return;
        var emailLower = user.email.toLowerCase().trim();
        var rec = (sharedState.users || []).find(function (u) {
          return (u.email || "").toLowerCase().trim() === emailLower;
        });
        var resolvedRole = emailLower === PRIMARY_ADMIN_EMAIL.toLowerCase()
          ? "admin"
          : (rec && rec.role) || (user.user_metadata && user.user_metadata.role) || "user";

        verifiedTrainer = {
          email: user.email,
          fullName: (rec && rec.name) || (user.user_metadata && user.user_metadata.full_name) || user.email,
          role: resolvedRole,
          lastAuthAt: new Date().toISOString()
        };
        try {
          localStorage.setItem(VERIFIED_USER_KEY, JSON.stringify(verifiedTrainer));
        } catch (e) {}
      }

      function loadSupabaseConfig() {
        try {
          var raw = localStorage.getItem(SB_CFG_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.url && parsed.anonKey) return parsed;
          }
        } catch (e) {}
        return { url: DEFAULT_SUPABASE_CONFIG.url, anonKey: DEFAULT_SUPABASE_CONFIG.anonKey };
      }

      function saveSupabaseConfig(cfg) {
        supabaseConfig = {
          url: (cfg.url || "").trim() || DEFAULT_SUPABASE_CONFIG.url,
          anonKey: (cfg.anonKey || "").trim() || DEFAULT_SUPABASE_CONFIG.anonKey
        };
        try {
          localStorage.setItem(SB_CFG_KEY, JSON.stringify(supabaseConfig));
        } catch (e) {}
      }

      function loadLocalState() {
        var def = createDefaultLocalData();
        try {
          offlineBypass = Boolean(verifiedTrainer) && localStorage.getItem(OFFLINE_MODE_KEY) === "1";
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return def;
          var parsed = JSON.parse(raw);
          if (parsed.sharedFallback) {
            sharedState = normalizeSharedState(parsed.sharedFallback);
          }
          if (parsed.local) {
            return Object.assign(def, parsed.local);
          }
        } catch (e) {}
        return def;
      }

      function persistLocalOnly() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            local: localState,
            sharedFallback: sharedState
          }));
        } catch (e) {}
      }

      function isSupabaseConfigured() {
        return Boolean(
          window.supabase &&
          supabaseConfig.url &&
          supabaseConfig.url.indexOf("https://") === 0 &&
          supabaseConfig.anonKey &&
          supabaseConfig.anonKey.length > 15
        );
      }

      function initSupabaseClient() {
        if (!isSupabaseConfigured()) {
          supabaseClient = null;
          syncStatus = "offline";
          return false;
        }
        try {
          supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);
          supabaseClient.auth.onAuthStateChange(function (event, session) {
            if (event === "PASSWORD_RECOVERY") {
              passwordRecoveryMode = true;
              currentUser = session ? session.user : currentUser;
              if (currentUser) saveVerifiedTrainer(currentUser);
              renderApp();
            }
          });
          return true;
        } catch (e) {
          supabaseClient = null;
          syncStatus = "error";
          syncErrorMessage = e.message || "Erreur initialisation Supabase";
          return false;
        }
      }

      async function pushSharedStateToSupabase() {
        persistLocalOnly();
        if (!supabaseClient || !currentUser) return;
        syncStatus = "syncing";
        updateSyncBadgeUI();

        var rec = getCurrentUserRecord();
        var author = (rec && rec.name) || (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email || "Formateur";
        sharedState.updatedAt = new Date().toISOString();
        sharedState.updatedBy = author;

        try {
          var res = await supabaseClient
            .from("cellule_etat")
            .upsert({
              id: "ggd85_main",
              data: sharedState,
              updated_at: sharedState.updatedAt,
              updated_by: author
            }, { onConflict: "id" });

          if (res.error) throw res.error;
          syncStatus = "online";
          syncErrorMessage = "";
        } catch (err) {
          syncStatus = "error";
          syncErrorMessage = err.message || "Échec synchro";
        }
        updateSyncBadgeUI();
      }

      function scheduleSharedSync() {
        persistLocalOnly();
        if (saveDebounceTimer) clearTimeout(saveDebounceTimer);
        saveDebounceTimer = setTimeout(function () {
          pushSharedStateToSupabase();
        }, 350);
      }

      async function pullAndSubscribeSupabase() {
        if (!supabaseClient || !currentUser) return;
        syncStatus = "syncing";
        updateSyncBadgeUI();

        try {
          var res = await supabaseClient
            .from("cellule_etat")
            .select("*")
            .eq("id", "ggd85_main")
            .maybeSingle();

          if (res.error) throw res.error;

          if (res.data && res.data.data) {
            sharedState = normalizeSharedState(res.data.data);
            saveVerifiedTrainer(currentUser);
            persistLocalOnly();
          } else {
            await pushSharedStateToSupabase();
          }

          if (realtimeChannel) {
            supabaseClient.removeChannel(realtimeChannel);
          }

          realtimeChannel = supabaseClient
            .channel("ggd85-cellule-realtime")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "cellule_etat", filter: "id=eq.ggd85_main" },
              function (payload) {
                if (payload.new && payload.new.data) {
                  sharedState = normalizeSharedState(payload.new.data);
                  if (currentUser) saveVerifiedTrainer(currentUser);
                  persistLocalOnly();
                  syncStatus = "online";
                  renderApp();
                  showToast("Mise à jour reçue (" + escapeHtml(payload.new.updated_by || "Cellule") + ")");
                }
              }
            )
            .subscribe(function (status) {
              if (status === "SUBSCRIBED") {
                syncStatus = "online";
                updateSyncBadgeUI();
              }
            });

          syncStatus = "online";
          syncErrorMessage = "";
          renderApp();
        } catch (err) {
          syncStatus = "error";
          syncErrorMessage = err.message || "Table cellule_etat inaccessible";
          renderApp();
        }
      }

      function updateSyncBadgeUI() {
        var pill = document.getElementById("header-sync-pill");
        if (!pill) return;
        pill.className = "sync-pill " + (syncStatus === "online" ? "online" : syncStatus === "error" ? "error" : "");
        var label = syncStatus === "online"
          ? "Synchronisé"
          : syncStatus === "syncing"
          ? "Synchro..."
          : syncStatus === "error"
          ? "Erreur synchro"
          : "Mode hors-ligne";
        pill.innerHTML = '<span class="sync-dot"></span><span>' + label + "</span>";
      }

      function uid(prefix) {
        return (prefix || "id") + "_" + Math.random().toString(36).slice(2, 9);

      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function getCurrentUserEmailExact() {

      function getStaffEmails() {
        var set = {};
        set[PRIMARY_ADMIN_EMAIL.toLowerCase()] = true;
        (sharedState.users || []).forEach(function (u) {
          if (u && u.email && u.active !== false && (u.role === "admin" || u.role === "referent")) {
            set[u.email.toLowerCase().trim()] = true;
          }
        });
        return Object.keys(set);
      }

      async function triggerEmailNotification(payload) {
        var hookUrl = sharedState.mailConfig && sharedState.mailConfig.webhookUrl ? sharedState.mailConfig.webhookUrl.trim() : "";
        if (!hookUrl) return { sent: false, reason: "no_webhook" };
        try {
          var bodyObj = {
            source: "cellule_secourisme_ggd85",
            sender: (sharedState.mailConfig && sharedState.mailConfig.senderLabel) || "Cellule Secourisme GGD85",
            event: payload.event,
            to: payload.to || [],
            subject: payload.subject || "",
            message: payload.message || "",
            meta: payload.meta || {},
            timestamp: new Date().toISOString()
          };
          var resp = await fetch(hookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyObj)
          });
          return { sent: resp.ok, status: resp.status };
        } catch (err) {
          return { sent: false, reason: err.message || "fetch_error" };
        }
      }

      function setupPwaAssets() {
        try {
          var svgBlob = new Blob([RONDACHE_SVG], { type: "image/svg+xml;charset=utf-8" });
          var url = URL.createObjectURL(svgBlob);
          var img = new Image();
          img.onload = function () {
            var canvas = document.createElement("canvas");
            canvas.width = 512;
            canvas.height = 512;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, 512, 512);
            var pngUrl = localState.customLogoDataUrl || canvas.toDataURL("image/png");
            URL.revokeObjectURL(url);

            var fav = document.getElementById("dynamic-favicon");
            var apple = document.getElementById("dynamic-apple-icon");
            if (fav) fav.href = pngUrl;
            if (apple) apple.href = pngUrl;

            var manifest = {
              name: "Cellule Secourisme GGD85",
              short_name: "Secourisme 85",
              start_url: "./",
              display: "standalone",
              background_color: "#090D16",
              theme_color: "#0B1E3D",
              icons: [
                { src: pngUrl, sizes: "192x192", type: "image/png" },
                { src: pngUrl, sizes: "512x512", type: "image/png" }
              ]
            };
            var mBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
            var mEl = document.getElementById("dynamic-manifest");
            if (mEl) mEl.href = URL.createObjectURL(mBlob);
          };
          img.src = url;
        } catch (e) {}
      }

      /* =====================================================================
         6. CHRONOMÈTRES MES
         ===================================================================== */
      function getMesElapsedMs(mes) {
        var base = mes.elapsedMs || 0;
        if (mes.running && mes.startedAt) {
          return base + (Date.now() - mes.startedAt);
        }
        return base;
      }

      function formatDuration(ms) {
        var totalSec = Math.max(0, Math.floor(ms / 1000));
        var mins = Math.floor(totalSec / 60);
        var secs = totalSec % 60;
        return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
      }

      setInterval(function () {
        var displays = document.querySelectorAll("[data-mes-timer]");
        if (!displays.length) return;
        for (var i = 0; i < displays.length; i++) {
          var id = displays[i].getAttribute("data-mes-timer");
          var mes = localState.activeMesList.find(function (m) { return m.id === id; });
          if (mes) {
            displays[i].textContent = formatDuration(getMesElapsedMs(mes));
          }
        }
      }, 250);

                      (sub.ready ? "● Prêt à la formation" : "▲ Incomplet") +
                      "</button>" +
                      (sub.reserved
                        ? '<button type="button" class="status-badge st-reserved" data-action="toggle-sublot-reserved" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '">● Réservé</button>'
                        : '<button type="button" class="status-badge st-avail" data-action="open-reservation-request" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '">Réserver</button>')

                      (sub.ready ? "● Prêt à la formation" : "▲ Incomplet") +
                      "</span>" +
                      (sub.reserved
                        ? '<span class="status-badge readonly st-reserved">● Réservé</span>'
                        : '<button type="button" class="status-badge st-avail" data-action="open-reservation-request" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '">Réserver</button>')) +
                  "    </div>" +
                  (sub.reserved && (sub.reservedBy || sub.reservedDates)
                    ? '<div class="muted" style="margin-top:7px;">Réservé par <strong>' + escapeHtml(sub.reservedBy || "Formateur") + "</strong>" + (sub.reservedDates ? " (" + escapeHtml(sub.reservedDates) + ")" : "") + "</div>"

                      subAlerts.map(function (sa) {
                        return '<div class="alert-line"><span><strong>' + escapeHtml(sa.type) + " :</strong> " + escapeHtml(sa.detail) + "</span>" +
                               (canEdit ? '<button type="button" class="btn btn-sm btn-ghost" data-action="resolve-alert" data-alert-id="' + escapeHtml(sa.id) + '">OK</button>' : "") +
                               "</div>";
                      }).join("") +
                      "</div>"
                    : "") +
                  "  </div>" +
                  '  <div class="sublot-actions">' +
                  '    <button type="button" class="btn btn-sm" data-action="open-inventory" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '">' + (canEdit ? "Inventaire" : "Voir inventaire") + "</button>" +
                  '    <button type="button" class="btn btn-sm btn-ghost" data-action="open-alert-modal" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '">Signaler</button>' +
                  (canEdit
                    ? '<button type="button" class="btn btn-sm btn-ghost" data-action="open-sublot-modal" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '">Renommer</button>' +
                      '<button type="button" class="btn btn-sm btn-danger" data-action="delete-sublot" data-master-id="' + escapeHtml(mLot.id) + '" data-sublot-id="' + escapeHtml(sub.id) + '" title="Supprimer le sous-lot">×</button>'
                    : "") +
                  "  </div>" +
                  "</article>";
              });
              html += "</div>";
            }
            html += "</div>";
          }
          html += "</section>";
        });

        return html;
      }

      function openModal(title, bodyHtml) {
        var root = document.getElementById("modal-root");
        root.innerHTML =
          '<div class="modal-backdrop" data-action="close-modal-backdrop">' +
          '  <div class="modal-box" role="dialog" aria-modal="true">' +
          '    <div class="modal-head">' +
          '      <h3 class="modal-title">' + escapeHtml(title) + "</h3>" +
          '      <button type="button" class="btn btn-sm btn-ghost" data-action="close-modal">✕</button>' +
          "    </div>" +
          bodyHtml +
          "  </div>" +
          "</div>";
      }

      function closeModal() {
        var root = document.getElementById("modal-root");
        if (root) root.innerHTML = "";
      }

        var subOptions = (currentMaster.sublots || []).map(function (s) {
