<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B1E3D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Secourisme GGD85" />
  <title>Cellule Secourisme GGD85 — Aide au Formateur</title>
  <link id="dynamic-favicon" rel="icon" type="image/png" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" />
  <link id="dynamic-manifest" rel="manifest" />
  <style>
    :root {
      --bg-app: #090D16;
      --bg-surface: #111827;
      --bg-card: #161F30;
      --bg-card-hover: #1D283D;
      --bg-input: #0D1320;
      --border: #26334D;
      --border-light: #334366;
      --navy: #0B1E3D;
      --navy-accent: #1E3A8A;
      --blue: #3B82F6;
      --blue-soft: rgba(59, 130, 246, 0.16);
      --gold: #EAB308;
      --gold-soft: rgba(234, 179, 8, 0.16);
      --red: #EF4444;
      --red-dark: #DC2626;
      --red-soft: rgba(239, 68, 68, 0.16);
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.16);
      --amber: #F59E0B;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, #09172E 0%, #10284E 100%);
      border-bottom: 1px solid rgba(234, 179, 8, 0.28);
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .header-inner {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .rondache-box {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.55);
      background: #161616;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rondache-box svg, .rondache-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-text { min-width: 0; }
    .brand-kicker {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 12px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
    }
    .sync-pill.online .sync-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .sync-pill.online { color: #86EFAC; border-color: rgba(34, 197, 94, 0.35); }
    .sync-pill.error .sync-dot { background: var(--red); }
    .sync-pill.error { color: #FCA5A5; border-color: rgba(239, 68, 68, 0.35); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    /* Desktop Top Nav */
    .desktop-nav {
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
    }

      margin: 0
