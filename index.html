        if (!mes) return;
        var chosen = mes.selectedStepIds || localState.keySteps.map(function (k) { return k.id; });

        var list = localState.keySteps.map(function (ks) {
          var checked = chosen.indexOf(ks.id) !== -1 ? " checked" : "";
          return (
            '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;color:var(--text);cursor:pointer;">' +
            '  <input type="checkbox" class="mes-step-chk" value="' + escapeHtml(ks.id) + '"' + checked + ' style="width:auto;margin:0;" />' +
            "  <span>" + escapeHtml(ks.label) + "</span>" +
            "</label>"
          );
        }).join("");

        openModal(
          "Étapes clés du chronomètre pour cette MES",
          '<form id="mes-steps-form" data-mes-id="' + escapeHtml(mesId) + '">' +
          list +
          '  <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;">Valider la sélection</button>' +
          "</form>"
        );
      }

      /* =====================================================================
         14. GESTIONNAIRE GLOBAL D'ÉVÉNEMENTS
         ===================================================================== */
      document.addEventListener("click", async function (e) {
        var target = e.target.closest("[data-action]");
        if (!target) return;
        var action = target.getAttribute("data-action");

        if (action === "close-modal") { closeModal(); return; }
        if (action === "close-modal-backdrop" && e.target === target) { closeModal(); return; }

        if (action === "forgot-password") {
          var emailInput = document.getElementById("login-email");
          var errBox = document.getElementById("login-error");
          var infoBox = document.getElementById("login-info");
          if (errBox) errBox.classList.add("hidden");
          if (infoBox) infoBox.classList.add("hidden");

          var emailVal = emailInput ? emailInput.value.trim() : "";
          if (!emailVal) {
            if (errBox) {
              errBox.textContent = "Saisissez d'abord votre adresse e-mail formateur ci-dessus, puis cliquez sur Mot de passe oublié.";
              errBox.classList.remove("hidden");
            }
            if (emailInput) emailInput.focus();
            return;
          }
          if (!supabaseClient && !initSupabaseClient()) {
            if (errBox) {
              errBox.textContent = "Client Supabase non initialisé.";
              errBox.classList.remove("hidden");
            }
            return;
          }
          var redirectUrl = window.location.origin + window.location.pathname;
          var resetRes = await supabaseClient.auth.resetPasswordForEmail(emailVal, {
            redirectTo: redirectUrl
          });
          if (resetRes.error) {
            if (errBox) {
              errBox.textContent = "Impossible d'envoyer le lien : " + resetRes.error.message;
              errBox.classList.remove("hidden");
            }
          } else if (infoBox) {
            infoBox.textContent = "Un lien de réinitialisation a été envoyé à " + emailVal + " (vérifiez vos courriers indésirables).";
            infoBox.classList.remove("hidden");
          }
          return;
        }

        if (action === "enter-offline-mode") {
          if (!verifiedTrainer) {
            showToast("Connexion initiale requise");
            return;
          }
          offlineBypass = true;
          syncStatus = "offline";
          try { localStorage.setItem(OFFLINE_MODE_KEY, "1"); } catch (err) {}
          renderApp();
          return;
        }

        if (action === "exit-offline-mode") {
          offlineBypass = false;
          try { localStorage.removeItem(OFFLINE_MODE_KEY); } catch (err) {}
          renderApp();
          return;
        }

        if (action === "logout") {
          if (supabaseClient) await supabaseClient.auth.signOut();
          currentUser = null;
          offlineBypass = false;
          passwordRecoveryMode = false;
          try { localStorage.removeItem(OFFLINE_MODE_KEY); } catch (err) {}
          renderApp();
          return;
        }

        if (action === "forget-device") {
          if (supabaseClient) await supabaseClient.auth.signOut();
          currentUser = null;
          verifiedTrainer = null;
          offlineBypass = false;
          passwordRecoveryMode = false;
          try {
            localStorage.removeItem(VERIFIED_USER_KEY);
            localStorage.removeItem(OFFLINE_MODE_KEY);
          } catch (err) {}
          renderApp();
          showToast("Autorisation hors-ligne retirée de cet appareil");
          return;
        }

        if (action === "sync-now") {
          await pullAndSubscribeSupabase();
          showToast("Synchronisation effectuée");
          return;
        }

        if (action === "switch-tab") {
          localState.activeTab = target.getAttribute("data-tab");
          persistLocalOnly();
          renderApp();
          return;
        }

        /* Gestion utilisateurs (Administrateur uniquement) */
        if (action === "open-user-modal") {
          if (!canManageUsers()) return;
          showUserModal(target.getAttribute("data-user-id"));
          return;
        }

        if (action === "delete-user") {
          if (!canManageUsers()) return;
          var uId = target.getAttribute("data-user-id");
          var targetUser = (sharedState.users || []).find(function (u) { return u.id === uId; });
          if (!targetUser) return;
          if ((targetUser.email || "").toLowerCase() === PRIMARY_ADMIN_EMAIL.toLowerCase()) {
            showToast("Impossible de supprimer l'administrateur principal");
            return;
          }
          if (!window.confirm("Retirer le profil de " + (targetUser.name || targetUser.email) + " ? Pensez aussi à supprimer son identifiant dans Supabase Auth.")) return;
          sharedState.users = sharedState.users.filter(function (u) { return u.id !== uId; });
          scheduleSharedSync();
          renderApp();
          showToast("Profil supprimé");
          return;
        }

        /* Gestion Lots & Sous-lots */
        if (action === "filter-sector") {
          localState.lotFilterSector = target.getAttribute("data-sector");
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "toggle-filter-alerts") {
          localState.lotFilterAlertsOnly = !localState.lotFilterAlertsOnly;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "toggle-master") {
          var mId = target.getAttribute("data-master-id");
          var mLot = sharedState.masterLots.find(function (m) { return m.id === mId; });
          if (mLot) {
            mLot.expanded = !mLot.expanded;
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "open-master-lot-modal") {
          if (!canManageLotsAndSites()) return;
          showMasterLotModal(target.getAttribute("data-master-id"));
          return;
        }

        if (action === "delete-master-lot") {
          if (!canManageLotsAndSites()) return;
          var delMId = target.getAttribute("data-master-id");
          var delMLot = sharedState.masterLots.find(function (m) { return m.id === delMId; });
          if (!delMLot) return;
          if (!window.confirm("Supprimer définitivement « " + delMLot.name + " » et tous ses sous-lots ?")) return;
          sharedState.masterLots = sharedState.masterLots.filter(function (m) { return m.id !== delMId; });
          sharedState.alerts = sharedState.alerts.filter(function (a) { return a.masterId !== delMId; });
          if (localState.lotFilterSector === delMLot.sector) localState.lotFilterSector = "ALL";
          scheduleSharedSync();
          renderApp();
          showToast("Lot principal supprimé");
          return;
        }

        if (action === "open-sublot-modal") {
          if (!canManageLotsAndSites()) return;
          showSublotModal(target.getAttribute("data-master-id"), target.getAttribute("data-sublot-id"));
          return;
        }

        if (action === "delete-sublot") {
          if (!canManageLotsAndSites()) return;
          var mSubDel = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sDelId = target.getAttribute("data-sublot-id");
          var sDelObj = mSubDel && (mSubDel.sublots || []).find(function (s) { return s.id === sDelId; });
          if (!sDelObj) return;
          if (!window.confirm("Supprimer le sous-lot « " + sDelObj.name + " » ?")) return;
          mSubDel.sublots = mSubDel.sublots.filter(function (s) { return s.id !== sDelId; });
          sharedState.alerts = sharedState.alerts.filter(function (a) { return a.sublotId !== sDelId; });
          scheduleSharedSync();
          renderApp();
          showToast("Sous-lot supprimé");
          return;
        }

        if (action === "toggle-sublot-ready") {
          if (!canManageLotsAndSites()) return;
          var mR = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sR = mR && mR.sublots.find(function (s) { return s.id === target.getAttribute("data-sublot-id"); });
          if (sR) {
            sR.ready = !sR.ready;
            scheduleSharedSync();
            renderApp();
          }
          return;
        }

        if (action === "open-reservation-request") {
          if (isUserSuspended()) return;
          showReservationModal(target.getAttribute("data-master-id"), target.getAttribute("data-sublot-id"));
          return;
        }

        if (action === "toggle-sublot-reserved") {
          if (!canManageLotsAndSites()) return;
          var mRes = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sRes = mRes && mRes.sublots.find(function (s) { return s.id === target.getAttribute("data-sublot-id"); });
          if (sRes && sRes.reserved) {
            sRes.reserved = false;
            sRes.reservedBy = "";
            sRes.reservedDates = "";
            scheduleSharedSync();
            renderApp();
            showToast("Lot libéré");
          }
          return;
        }

        if (action === "decide-reservation") {
          if (!canManageLotsAndSites()) return;
          var reqId = target.getAttribute("data-req-id");
          var decision = target.getAttribute("data-decision");
          var reqObj = (sharedState.reservationRequests || []).find(function (r) { return r.id === reqId; });
          if (!reqObj) return;

          var recDec = getCurrentUserRecord();
          var decAuthor = (recDec && recDec.name) || (currentUser && ((currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email)) || (verifiedTrainer ? verifiedTrainer.email : "Référent");

          reqObj.status = decision;
          reqObj.decidedBy = decAuthor;
          reqObj.decisionUpdatedAt = new Date().toISOString();
          reqObj.seenByRequester = false;

          if (decision === "approved") {
            var mTarget = sharedState.masterLots.find(function (m) { return m.id === reqObj.masterId; });
            var sTarget = mTarget && (mTarget.sublots || []).find(function (s) { return s.id === reqObj.sublotId; });
            if (sTarget) {
              sTarget.reserved = true;
              sTarget.reservedBy = reqObj.requesterName || reqObj.requesterEmail;
              sTarget.reservedDates = reqObj.dateText;
            }
          }

          scheduleSharedSync();
          renderApp();
          showToast("Demande mise à jour : " + getReservationDecisionLabel(decision));

          if (reqObj.requesterEmail) {
            await triggerEmailNotification({
              event: "reservation_decision",
              to: [reqObj.requesterEmail],
              subject: "[GGD85] Réponse à votre demande de réservation — " + reqObj.lotLabel,
              message: "Votre demande de réservation pour « " + reqObj.lotLabel + " » à la date du " + reqObj.dateText + " est : " + getReservationDecisionLabel(decision) + " (traitée par " + decAuthor + ").",
              meta: {
                requestId: reqObj.id,
                lotLabel: reqObj.lotLabel,
                dateText: reqObj.dateText,
                status: decision,
                decidedBy: decAuthor
              }
            });
          }
          return;
        }

        if (action === "ack-reservation-notice") {
          var ackId = target.getAttribute("data-req-id");
          var ackReq = (sharedState.reservationRequests || []).find(function (r) { return r.id === ackId; });
          if (ackReq) {
            ackReq.seenByRequester = true;
            scheduleSharedSync();
            renderApp();
          }
          return;
        }

        if (action === "dismiss-my-reservation-notices") {
          var myEmailAck = getCurrentEmail();
          (sharedState.reservationRequests || []).forEach(function (r) {
            if (myEmailAck && (r.requesterEmail || "").toLowerCase().trim() === myEmailAck && r.decisionUpdatedAt) {
              r.seenByRequester = true;
            }
          });
          scheduleSharedSync();
          renderApp();
          return;
        }

        if (action === "open-alert-modal") {
          if (!canReportAlert()) return;
          showAlertModal(target.getAttribute("data-master-id"), target.getAttribute("data-sublot-id"));
          return;
        }

        if (action === "resolve-alert") {
          if (!canManageLotsAndSites()) return;
          var alId = target.getAttribute("data-alert-id");
          sharedState.alerts = sharedState.alerts.filter(function (a) { return a.id !== alId; });
          scheduleSharedSync();
          renderApp();
          showToast("Alerte clôturée");
          return;
        }

        if (action === "open-inventory") {
          showInventoryModal(target.getAttribute("data-master-id"), target.getAttribute("data-sublot-id"));
          return;
        }

        if (action === "toggle-inv-item") {
          if (!canManageLotsAndSites()) return;
          var mI = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sI = mI && mI.sublots.find(function (s) { return s.id === target.getAttribute("data-sublot-id"); });
          var idxI = parseInt(target.getAttribute("data-idx"), 10);
          if (sI && sI.items[idxI]) {
            sI.items[idxI].ok = !sI.items[idxI].ok;
            scheduleSharedSync();
            renderApp();
          }
          return;
        }

        if (action === "delete-inv-item") {
          if (!canManageLotsAndSites()) return;
          var mD = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sD = mD && mD.sublots.find(function (s) { return s.id === target.getAttribute("data-sublot-id"); });
          var idxD = parseInt(target.getAttribute("data-idx"), 10);
          if (sD) {
            sD.items.splice(idxD, 1);
            scheduleSharedSync();
            showInventoryModal(mD.id, sD.id);
            renderApp();
          }
          return;
        }

        if (action === "open-site-modal") {
          if (!canManageLotsAndSites()) return;
          showSiteModal(target.getAttribute("data-site-id"));
          return;
        }

        if (action === "delete-site") {
          if (!canManageLotsAndSites()) return;
          var siteDelId = target.getAttribute("data-site-id");
          var siteObj = sharedState.sites.find(function (s) { return s.id === siteDelId; });
          if (!siteObj) return;
          if (!window.confirm("Supprimer le site « " + siteObj.name + " » ?")) return;
          sharedState.sites = sharedState.sites.filter(function (s) { return s.id !== siteDelId; });
          scheduleSharedSync();
          renderApp();
          showToast("Site supprimé");
          return;
        }

        /* Pédagogie actions */
        if (action === "switch-ped-subtab") {
          localState.pedSubTab = target.getAttribute("data-subtab");
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "set-course-type") {
          localState.session.courseType = target.getAttribute("data-course");
          if (localState.session.courseType === "PSC") localState.session.trinomeEnabled = false;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "toggle-trinome") {
          localState.session.trinomeEnabled = !localState.session.trinomeEnabled;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "add-learners") {
          var inp = document.getElementById("learner-input");
          if (inp && inp.value.trim()) {
            var names = inp.value.split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
            localState.session.learners = localState.session.learners.concat(names);
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "remove-learner") {
          var lIdx = parseInt(target.getAttribute("data-idx"), 10);
          localState.session.learners.splice(lIdx, 1);
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "clear-learners") {
          localState.session.learners = [];
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "random-assign-mes") {
          var learners = localState.session.learners.slice();
          if (learners.length === 0) {
            showToast("Ajoutez d'abord les apprenants de la session");
            return;
          }
          for (var i = learners.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = learners[i]; learners[i] = learners[j]; learners[j] = tmp;
          }
          var groupSize = localState.session.courseType === "PSC" ? 1 : (localState.session.trinomeEnabled ? 3 : 2);
          var formatName = groupSize === 1 ? "Solo" : groupSize === 2 ? "Binôme" : "Trinôme";
          var pool = localState.scenarios.filter(function (s) { return s.course === localState.session.courseType || s.course === "TOUS"; });
          if (pool.length === 0) pool = localState.scenarios.slice();

          var created = [];
          for (var g = 0; g < learners.length; g += groupSize) {
            var grp = learners.slice(g, g + groupSize);
            var scPick = pool[(created.length) % pool.length];
            created.push({
              id: uid("mes"),
              format: grp.length === 1 ? "Solo" : grp.length === 2 ? "Binôme" : formatName,
              learners: grp,
              scenarioTitle: scPick ? scPick.title : "Mise en situation",
              scenarioContext: scPick ? scPick.context : "",
              elapsedMs: 0,
              running: false,
              startedAt: null,
              observations: "",
              actions: "",
              positives: "",
              improvements: "",
              debrief: ""
            });
          }
          localState.activeMesList = created;
          localState.selectedMesId = created[0].id;
          localState.pedSubTab = "conduite";
          persistLocalOnly();
          renderApp();
          showToast(created.length + " mise(s) en situation générée(s)");
          return;
        }

        if (action === "launch-scenario") {
          var scId = target.getAttribute("data-scenario-id");
          var scObj = localState.scenarios.find(function (s) { return s.id === scId; });
          if (!scObj) return;
          var newMes = {
            id: uid("mes"),
            format: localState.session.courseType,
            learners: localState.session.learners.slice(0, localState.session.courseType === "PSC" ? 1 : 2),
            scenarioTitle: scObj.title,
            scenarioContext: scObj.context,
            elapsedMs: 0,
            running: false,
            startedAt: null,
            observations: "",
            actions: "",
            positives: "",
            improvements: "",
            debrief: ""
          };
          localState.activeMesList.push(newMes);
          localState.selectedMesId = newMes.id;
          localState.pedSubTab = "conduite";
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "select-mes") {
          localState.selectedMesId = target.getAttribute("data-mes-id");
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "toggle-mes-timer") {
          var mesT = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesT) {
            if (mesT.running) {
              mesT.elapsedMs = getMesElapsedMs(mesT);
              mesT.running = false;
              mesT.startedAt = null;
            } else {
              mesT.running = true;
              mesT.startedAt = Date.now();
            }
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "reset-mes-timer") {
          var mesR = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesR) {
            mesR.elapsedMs = 0;
            mesR.running = false;
            mesR.startedAt = null;
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "stamp-mes-step") {
          var mesS = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesS) {
            var stamp = "[" + formatDuration(getMesElapsedMs(mesS)) + "] " + target.getAttribute("data-step-label");
            mesS.actions = (mesS.actions ? mesS.actions.trim() + "\n" : "") + stamp;
            persistLocalOnly();
            renderApp();
            showToast("Top Chrono : " + stamp);
          }
          return;
        }

        if (action === "open-mes-steps-modal") {
          showMesStepsModal(target.getAttribute("data-mes-id"));
          return;
        }

        if (action === "copy-mes-summary") {
          var mesC = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesC) {
            var txt = [
              "BILAN MES — CELLULE SECOURISME GGD85",
              "Scénario : " + mesC.scenarioTitle,
              "Apprenant(s) : " + ((mesC.learners || []).join(", ") || "N/C"),
              "Durée : " + formatDuration(getMesElapsedMs(mesC)),
              "Observations : " + (mesC.observations || "-"),
              "Actions réalisées :\n" + (mesC.actions || "-"),
              "Points positifs : " + (mesC.positives || "-"),
              "Points à reprendre : " + (mesC.improvements || "-"),
              "Débriefing : " + (mesC.debrief || "-")
            ].join("\n");
            if (navigator.clipboard) navigator.clipboard.writeText(txt);
            showToast("Bilan MES copié dans le presse-papiers");
          }
          return;
        }

        if (action === "archive-mes") {
          var idA = target.getAttribute("data-mes-id");
          var idxA = localState.activeMesList.findIndex(function (m) { return m.id === idA; });
          if (idxA !== -1) {
            var mA = localState.activeMesList[idxA];
            localState.mesHistory.unshift({
              id: mA.id,
              scenarioTitle: mA.scenarioTitle,
              learners: mA.learners,
              duration: formatDuration(getMesElapsedMs(mA)),
              debrief: mA.debrief,
              archivedAt: new Date().toLocaleDateString("fr-FR")
            });
            localState.activeMesList.splice(idxA, 1);
            localState.selectedMesId = localState.activeMesList[0] ? localState.activeMesList[0].id : null;
            persistLocalOnly();
            renderApp();
            showToast("MES archivée");
          }
          return;
        }

        if (action === "delete-mes") {
          var idDel = target.getAttribute("data-mes-id");
          localState.activeMesList = localState.activeMesList.filter(function (m) { return m.id !== idDel; });
          localState.selectedMesId = localState.activeMesList[0] ? localState.activeMesList[0].id : null;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "copy-history-item") {
          var hItem = localState.mesHistory.find(function (h) { return h.id === target.getAttribute("data-hist-id"); });
          if (hItem && navigator.clipboard) {
            navigator.clipboard.writeText(hItem.scenarioTitle + " (" + hItem.duration + ") — " + (hItem.learners || []).join(", ") + "\n" + (hItem.debrief || ""));
            showToast("Archive copiée");
          }
          return;
        }

        if (action === "open-scenario-modal") {
          showScenarioModal(target.getAttribute("data-scenario-id"));
          return;
        }

        if (action === "delete-scenario") {
          var scDelId = target.getAttribute("data-scenario-id");
          localState.scenarios = localState.scenarios.filter(function (s) { return s.id !== scDelId; });
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "add-keystep") {
          var ksInp = document.getElementById("new-keystep-input");
          if (ksInp && ksInp.value.trim()) {
            localState.keySteps.push({ id: uid("ks"), label: ksInp.value.trim() });
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "remove-keystep") {
          var ksId = target.getAttribute("data-ks-id");
          localState.keySteps = localState.keySteps.filter(function (k) { return k.id !== ksId; });
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "reset-logo") {
          localState.customLogoDataUrl = "";
          persistLocalOnly();
          setupPwaAssets();
          renderApp();
          return;
        }

        if (action === "export-json") {
          var blob = new Blob([JSON.stringify({ shared: sharedState, local: localState }, null, 2)], { type: "application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "sauvegarde-cellule-secourisme-ggd85.json";
          a.click();
          return;
        }
      });

      /* Sauvegarde temps réel des notes MES sans perte de focus */
      document.addEventListener("input", function (e) {
        var field = e.target.getAttribute("data-mes-field");
        if (!field) return;
        var mesId = e.target.getAttribute("data-mes-id");
        var mes = localState.activeMesList.find(function (m) { return m.id === mesId; });
        if (mes) {
          mes[field] = e.target.value;
          persistLocalOnly();
        }
      });

      /* Mise à jour dynamique du sélecteur de sous-lot & imports fichiers */
      document.addEventListener("change", function (e) {
        if (e.target && e.target.id === "alert-master-select") {
          var m = sharedState.masterLots.find(function (x) { return x.id === e.target.value; });
          var subSel = document.getElementById("alert-sublot-select");
          if (m && subSel) {
            subSel.innerHTML = (m.sublots || []).map(function (s) {
              return '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + "</option>";
            }).join("") || '<option value="">Lot général</option>';
          }
        }

        if (e.target && e.target.id === "logo-file-input" && e.target.files && e.target.files[0]) {
          var reader = new FileReader();
          reader.onload = function (ev) {
            localState.customLogoDataUrl = ev.target.result;
            persistLocalOnly();
            setupPwaAssets();
            renderApp();
            showToast("Rondache personnalisée appliquée");
          };
          reader.readAsDataURL(e.target.files[0]);
        }

        if (e.target && e.target.id === "import-json-input" && e.target.files && e.target.files[0]) {
          var rJson = new FileReader();
          rJson.onload = function (ev) {
            try {
              var imported = JSON.parse(ev.target.result);
              if (imported.shared && canManageLotsAndSites()) {
                sharedState = normalizeSharedState(imported.shared);
                scheduleSharedSync();
              }
              if (imported.local) {
                localState = Object.assign(createDefaultLocalData(), imported.local);
                persistLocalOnly();
              }
              renderApp();
              showToast("Sauvegarde importée");
            } catch (err) {
              showToast("Fichier JSON invalide");
            }
          };
          rJson.readAsText(e.target.files[0]);
        }
      });

      /* Soumission des formulaires */
      document.addEventListener("submit", async function (e) {
        var form = e.target;
        if (!form || !form.id) return;
        e.preventDefault();

        if (form.id === "supabase-new-password-form") {
          var p1 = document.getElementById("new-pass-1").value;
          var p2 = document.getElementById("new-pass-2").value;
          var recErr = document.getElementById("recovery-error");
          if (p1 !== p2) {
            recErr.textContent = "Les deux mots de passe ne correspondent pas.";
            recErr.classList.remove("hidden");
            return;
          }
          var updRes = await supabaseClient.auth.updateUser({ password: p1 });
          if (updRes.error) {
            recErr.textContent = "Erreur : " + updRes.error.message;
            recErr.classList.remove("hidden");
            return;
          }
          passwordRecoveryMode = false;
          currentUser = updRes.data.user;
          saveVerifiedTrainer(currentUser);
          showToast("Mot de passe mis à jour");
          await pullAndSubscribeSupabase();
          return;
        }

        if (form.id === "supabase-login-form") {
          var email = document.getElementById("login-email").value.trim();
          var pass = document.getElementById("login-pass").value;
          var errBox = document.getElementById("login-error");
          if (!supabaseClient && !initSupabaseClient()) {
            errBox.textContent = "Client Supabase non initialisé.";
            errBox.classList.remove("hidden");
            return;
          }
          var authRes = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
          if (authRes.error) {
            errBox.textContent = "Connexion refusée : " + authRes.error.message;
            errBox.classList.remove("hidden");
            return;
          }
          currentUser = authRes.data.user;
          saveVerifiedTrainer(currentUser);
          offlineBypass = false;
          try { localStorage.removeItem(OFFLINE_MODE_KEY); } catch (err) {}
          await pullAndSubscribeSupabase();
          return;
        }

        if (form.id === "user-profile-form") {
          if (!canManageUsers()) return;
          var editUId = form.getAttribute("data-user-id");
          var uName = document.getElementById("usr-name").value.trim();
          var uEmail = document.getElementById("usr-email").value.trim().toLowerCase();
          var isPrimary = uEmail === PRIMARY_ADMIN_EMAIL.toLowerCase();
          var uRole = isPrimary ? "admin" : document.getElementById("usr-role").value;
          var activeEl = document.getElementById("usr-active");
          var uActive = isPrimary ? true : (activeEl && activeEl.type === "checkbox" ? activeEl.checked : true);

          if (!sharedState.users) sharedState.users = [];

          if (editUId) {
            var idxU = sharedState.users.findIndex(function (x) { return x.id === editUId; });
            if (idxU !== -1) {
              sharedState.users[idxU] = Object.assign({}, sharedState.users[idxU], {
                name: uName,
                email: uEmail,
                role: uRole,
                active: uActive
              });
            }
          } else {
            var exists = sharedState.users.findIndex(function (x) { return (x.email || "").toLowerCase() === uEmail; });
            if (exists !== -1) {
              sharedState.users[exists].name = uName;
              sharedState.users[exists].role = uRole;
              sharedState.users[exists].active = uActive;
            } else {
              sharedState.users.push({
                id: uid("usr"),
                email: uEmail,
                name: uName,
                role: uRole,
                active: uActive,
                createdAt: new Date().toISOString()
              });
            }
          }
          closeModal();
          scheduleSharedSync();
          renderApp();
          showToast("Profil enregistré (pensez à vérifier Supabase Auth)");
          return;
        }

        if (form.id === "master-lot-form") {
          if (!canManageLotsAndSites()) return;
          var editMId = form.getAttribute("data-master-id");
          var mName = document.getElementById("mlot-name").value.trim();
          var mSector = document.getElementById("mlot-sector").value.trim().toUpperCase();

          if (editMId) {
            var mObj = sharedState.masterLots.find(function (m) { return m.id === editMId; });
            if (mObj) {
              mObj.name = mName;
              mObj.sector = mSector;
            }
          } else {
            sharedState.masterLots.push({
              id: uid("lot"),
              name: mName,
              sector: mSector,
              expanded: true,
              sublots: []
            });
          }
          closeModal();
          scheduleSharedSync();
          renderApp();
          showToast(editMId ? "Lot modifié" : "Nouveau lot créé");
          return;
        }

        if (form.id === "sublot-form") {
          if (!canManageLotsAndSites()) return;
          var mA = sharedState.masterLots.find(function (m) { return m.id === form.getAttribute("data-master-id"); });
          var editSubId = form.getAttribute("data-sublot-id");
          var nameA = document.getElementById("sublot-name-input").value.trim();
          if (mA && nameA) {
            if (!mA.sublots) mA.sublots = [];
            if (editSubId) {
              var sObj = mA.sublots.find(function (s) { return s.id === editSubId; });
              if (sObj) sObj.name = nameA;
            } else {
              mA.sublots.push({
                id: uid("sub"),
                name: nameA,
                ready: true,
                reserved: false,
                reservedBy: "",
                reservedDates: "",
                items: []
              });
              mA.comingSoon = false;
            }
            closeModal();
            scheduleSharedSync();
            renderApp();
            showToast(editSubId ? "Sous-lot renommé" : "Sous-lot créé");
          }
          return;
        }

        if (form.id === "alert-form") {
          if (!canReportAlert()) return;
          var mId = document.getElementById("alert-master-select").value;
          var sId = document.getElementById("alert-sublot-select").value;
          var type = document.getElementById("alert-type-select").value;
          var detail = document.getElementById("alert-detail-input").value.trim();
          var markInc = document.getElementById("alert-mark-incomplete").checked;

          var mObjA = sharedState.masterLots.find(function (m) { return m.id === mId; });
          var sObjA = mObjA && (mObjA.sublots || []).find(function (s) { return s.id === sId; });
          var label = (mObjA ? mObjA.name : "") + (sObjA ? " — " + sObjA.name : "");
          var recA = getCurrentUserRecord();
          var author = (recA && recA.name) || (currentUser && ((currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email)) || (verifiedTrainer ? verifiedTrainer.email : "Formateur");

          sharedState.alerts.unshift({
            id: uid("al"),
            masterId: mId,
            sublotId: sId,
            lotLabel: label,
            type: type,
            detail: detail,
            author: author,
            createdAt: new Date().toISOString()
          });

          if (markInc && sObjA) sObjA.ready = false;
          closeModal();
          scheduleSharedSync();
          renderApp();
          showToast("Signalement enregistré");

          await triggerEmailNotification({
            event: "material_alert",
            to: getStaffEmails(),
            subject: "[GGD85] Signalement matériel (" + type + ") — " + label,
            message: "Signalement par " + author + " sur « " + label + " » : " + detail,
            meta: {
              masterId: mId,
              sublotId: sId,
              type: type,
              detail: detail,
              author: author
            }
          });
          return;
        }

        if (form.id === "reserve-request-form") {
          if (isUserSuspended()) return;
          var mReqId = form.getAttribute("data-master-id");
          var sReqId = form.getAttribute("data-sublot-id");
          var mReqObj = sharedState.masterLots.find(function (m) { return m.id === mReqId; });
          var sReqObj = mReqObj && (mReqObj.sublots || []).find(function (s) { return s.id === sReqId; });
          var reqBy = document.getElementById("res-req-by").value.trim();
          var reqEmail = document.getElementById("res-req-email").value.trim().toLowerCase();
          var reqDate = document.getElementById("res-req-date").value.trim();
          var reqNotes = document.getElementById("res-req-notes").value.trim();
          var lotLabelReq = (mReqObj ? mReqObj.name : "") + (sReqObj ? " — " + sReqObj.name : "");

          if (!sharedState.reservationRequests) sharedState.reservationRequests = [];
          sharedState.reservationRequests.unshift({
            id: uid("req"),
            masterId: mReqId,
            sublotId: sReqId,
            lotLabel: lotLabelReq,
            requesterName: reqBy,
            requesterEmail: reqEmail,
            dateText: reqDate,
            notes: reqNotes,
            status: "pending",
            createdAt: new Date().toISOString(),
            decidedBy: "",
            decisionUpdatedAt: "",
            seenByRequester: true
          });

          closeModal();
          scheduleSharedSync();
          renderApp();
          showToast("Demande de réservation transmise");

          await triggerEmailNotification({
            event: "reservation_request",
            to: getStaffEmails(),
            subject: "[GGD85] Demande de réservation — " + lotLabelReq + " (" + reqDate + ")",
            message: "Demande formulée par " + reqBy + " (" + reqEmail + ") pour « " + lotLabelReq + " » à la date du " + reqDate + (reqNotes ? " — " + reqNotes : ""),
            meta: {
              masterId: mReqId,
              sublotId: sReqId,
              lotLabel: lotLabelReq,
              requesterName: reqBy,
              requesterEmail: reqEmail,
              dateText: reqDate,
              notes: reqNotes
            }
          });
          return;
        }

        if (form.id === "mail-config-form") {
          if (!canManageUsers()) return;
          var hookVal = document.getElementById("mail-webhook-url").value.trim();
          var senderVal = document.getElementById("mail-sender-label").value.trim() || "Cellule Secourisme GGD85";
          sharedState.mailConfig = {
            webhookUrl: hookVal,
            senderLabel: senderVal
          };
          scheduleSharedSync();
          renderApp();
          showToast("Configuration mail enregistrée");
          return;
        }

        if (form.id === "reserve-form") {
          if (!canManageLotsAndSites()) return;
          var mR = sharedState.masterLots.find(function (m) { return m.id === form.getAttribute("data-master-id"); });
          var sR = mR && mR.sublots.find(function (s) { return s.id === form.getAttribute("data-sublot-id"); });
          if (sR) {
            sR.reserved = true;
            sR.reservedBy = document.getElementById("res-by").value.trim();
            sR.reservedDates = document.getElementById("res-dates").value.trim();
            closeModal();
            scheduleSharedSync();
            renderApp();
            showToast("Sous-lot réservé");
          }
          return;
        }

        if (form.id === "add-inv-form") {
          if (!canManageLotsAndSites()) return;
          var mInv = sharedState.masterLots.find(function (m) { return m.id === form.getAttribute("data-master-id"); });
          var sInv = mInv && mInv.sublots.find(function (s) { return s.id === form.getAttribute("data-sublot-id"); });
          var nInv = document.getElementById("inv-new-name").value.trim();
          var qInv = parseInt(document.getElementById("inv-new-qty").value, 10) || 1;
          if (sInv && nInv) {
            sInv.items.push({ id: uid("it"), name: nInv, qty: qInv, ok: true });
            scheduleSharedSync();
            showInventoryModal(mInv.id, sInv.id);
            renderApp();
          }
          return;
        }

        if (form.id === "site-form") {
          if (!canManageLotsAndSites()) return;
          var editSiteId = form.getAttribute("data-site-id");
          var payloadSite = {
            id: editSiteId || uid("site"),
            name: document.getElementById("site-name").value.trim(),
            keys: document.getElementById("site-keys").value.trim(),
            location: document.getElementById("site-location").value.trim(),
            storage: document.getElementById("site-storage").value.trim(),
            notes: document.getElementById("site-notes").value.trim()
          };
          if (editSiteId) {
            var idxS = sharedState.sites.findIndex(function (s) { return s.id === editSiteId; });
            if (idxS !== -1) sharedState.sites[idxS] = payloadSite;
          } else {
            sharedState.sites.push(payloadSite);
          }
          closeModal();
          scheduleSharedSync();
          renderApp();
          return;
        }

        if (form.id === "scenario-form") {
          var editScId = form.getAttribute("data-scenario-id");
          var scPayload = {
            id: editScId || uid("sc"),
            title: document.getElementById("sc-title").value.trim(),
            course: document.getElementById("sc-course").value,
            formats: ["Solo", "Binôme", "Trinôme"],
            context: document.getElementById("sc-context").value.trim()
          };
          if (editScId) {
            var idxSc = localState.scenarios.findIndex(function (s) { return s.id === editScId; });
            if (idxSc !== -1) localState.scenarios[idxSc] = scPayload;
          } else {
            localState.scenarios.unshift(scPayload);
          }
          closeModal();
          persistLocalOnly();
          renderApp();
          return;
        }

        if (form.id === "mes-steps-form") {
          var mesId = form.getAttribute("data-mes-id");
          var mes = localState.activeMesList.find(function (m) { return m.id === mesId; });
          if (mes) {
            var checks = form.querySelectorAll(".mes-step-chk:checked");
            mes.selectedStepIds = Array.prototype.map.call(checks, function (c) { return c.value; });
            closeModal();
            persistLocalOnly();
            renderApp();
          }
          return;
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeModal();
      });

      /* =====================================================================
         15. INITIALISATION AU DÉMARRAGE
         ===================================================================== */
      async function bootstrap() {
        setupPwaAssets();
        if (initSupabaseClient()) {
          try {
            var sessRes = await supabaseClient.auth.getSession();
            if (sessRes.data && sessRes.data.session && sessRes.data.session.user) {
              currentUser = sessRes.data.session.user;
              saveVerifiedTrainer(currentUser);
              await pullAndSubscribeSupabase();
              return;
            }
          } catch (e) {}
        }
        renderApp();
      }

      bootstrap();
    })();
  </script>
</body>
</html>
