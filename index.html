<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B1E3D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Secourisme GGD85" />
  <title>Cellule Secourisme GGD85 — Aide au Formateur</title>
  <link id="dynamic-favicon" rel="icon" type="image/png" />
  <link id="dynamic-apple-icon" rel="apple-touch-icon" />
  <link id="dynamic-manifest" rel="manifest" />
  <style>
    :root {
      --bg-app: #090D16;
      --bg-surface: #111827;
      --bg-card: #161F30;
      --bg-card-hover: #1D283D;
      --bg-input: #0D1320;
      --border: #26334D;
      --border-light: #334366;
      --navy: #0B1E3D;
      --navy-accent: #1E3A8A;
      --blue: #3B82F6;
      --blue-soft: rgba(59, 130, 246, 0.16);
      --gold: #EAB308;
      --gold-soft: rgba(234, 179, 8, 0.16);
      --red: #EF4444;
      --red-dark: #DC2626;
      --red-soft: rgba(239, 68, 68, 0.16);
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.16);
      --amber: #F59E0B;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, #09172E 0%, #10284E 100%);
      border-bottom: 1px solid rgba(234, 179, 8, 0.28);
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .header-inner {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .rondache-box {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.55);
      background: #161616;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rondache-box svg, .rondache-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .brand-text { min-width: 0; }
    .brand-kicker {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub {
      font-size: 12px;
      color: #CBD5E1;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border-light);
      color: var(--text-muted);
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
    }
    .sync-pill.online .sync-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .sync-pill.online { color: #86EFAC; border-color: rgba(34, 197, 94, 0.35); }
    .sync-pill.error .sync-dot { background: var(--red); }
    .sync-pill.error { color: #FCA5A5; border-color: rgba(239, 68, 68, 0.35); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    /* Desktop Top Nav */
    .desktop-nav {
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
    }
    .desktop-nav-inner {
      max-width: 1060px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (min-width: 768px) {
      .desktop-nav { display: block; }
      .mobile-nav { display: none !important; }
      .main-container { padding-bottom: 32px !important; }
    }

    /* Mobile Bottom Nav */
    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 45;
      background: rgba(13, 19, 32, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
      gap: 4px;
    }
    .nav-btn {
      position: relative;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 11px;
      padding: 7px 4px;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .desktop-nav .nav-btn {
      flex-direction: row;
      padding: 10px 12px;
      font-size: 13.5px;
      gap: 8px;
    }
    .nav-btn.active {
      background: rgba(30, 58, 138, 0.45);
      border-color: rgba(59, 130, 246, 0.45);
      color: #FFFFFF;
    }
    .nav-badge {
      position: absolute;
      top: 4px;
      right: 14px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .desktop-nav .nav-badge { position: static; }
    .badge-red { background: var(--red); color: #fff; }
    .badge-green { background: var(--green); color: #052e16; animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    /* Main Layout */
    .main-container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 16px 14px 92px;
    }
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .page-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .page-desc {
      margin: 3px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover { background: var(--bg-card-hover); }
    .btn:active { transform: scale(0.98); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-primary { background: var(--navy-accent); border-color: #3B82F6; color: #fff; }
    .btn-primary:hover { background: #254EDB; }
    .btn-danger { background: var(--red-dark); border-color: #F87171; color: #fff; }
    .btn-danger:hover { background: #B91C1C; }
    .btn-success { background: #15803D; border-color: #4ADE80; color: #fff; }
    .btn-success:hover { background: #166534; }
    .btn-amber { background: #B45309; border-color: #FBBF24; color: #fff; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-muted); }

    /* Cards & Accordions */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 14px;
    }
    .chip {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip.active {
      background: var(--navy-accent);
      border-color: var(--blue);
      color: #fff;
    }
    .chip.chip-alert.active {
      background: var(--red-dark);
      border-color: #FCA5A5;
      color: #fff;
    }

    /* Master Lots & Sub-lots */
    .master-lot {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .master-header {
      width: 100%;
      background: linear-gradient(90deg, rgba(11,30,61,0.9), rgba(22,31,48,0.95));
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      padding: 14px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
    }
    .master-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sector-pill {
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: var(--blue-soft);
      color: #93C5FD;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }
    .master-name { font-size: 17px; font-weight: 800; }
    .master-body { padding: 12px; }
    .sublot-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 720px) {
      .sublot-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .sublot-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .sublot-card.has-alert { border-color: rgba(239, 68, 68, 0.55); }
    .sublot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .sublot-title { font-size: 15.5px; font-weight: 800; margin: 0; }
    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .status-badge {
      padding: 4px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .st-ready { background: var(--green-soft); color: #86EFAC; border-color: rgba(34, 197, 94, 0.35); }
    .st-incomplete { background: var(--red-soft); color: #FCA5A5; border-color: rgba(239, 68, 68, 0.4); }
    .st-avail { background: var(--blue-soft); color: #93C5FD; border-color: rgba(59, 130, 246, 0.35); }
    .st-reserved { background: var(--amber-soft); color: #FCD34D; border-color: rgba(245, 158, 11, 0.4); }
    .alert-box {
      background: rgba(239, 68, 68, 0.11);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #FECACA;
    }
    .info-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.38);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: #BBF7D0;
    }
    .alert-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
    }
    .sublot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    /* Pedagogy Sub-tabs (Zero overlap 3-col grid) */
    .ped-subtabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 16px;
    }
    .ped-subtab {
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      border-radius: 9px;
      padding: 9px 6px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      line-height: 1.2;
      word-break: break-word;
    }
    .ped-subtab.active {
      background: var(--navy-accent);
      border-color: var(--blue);
      color: #fff;
    }
    .inline-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      background: rgba(255,255,255,0.16);
      color: #fff;
      flex-shrink: 0;
    }

    /* Sticky Chrono in Conduite MES */
    .chrono-sticky {
      position: sticky;
      top: 72px;
      z-index: 30;
      background: linear-gradient(135deg, #0D1E3A 0%, #16233B 100%);
      border: 1px solid rgba(59, 130, 246, 0.45);
      border-radius: var(--radius);
      padding: 13px;
      margin-bottom: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    }
    .chrono-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #FFFFFF;
    }
    .chrono-display.running { color: #4ADE80; }
    .top-chrono-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .top-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-light);
      color: #E2E8F0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Forms */
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    input[type="text"], input[type="email"], input[type="password"], input[type="url"], select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 10px 11px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 11px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    textarea { min-height: 76px; resize: vertical; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(3, 7, 18, 0.78);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.65);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { margin: 0; font-size: 17px; font-weight: 800; }

    /* Auth Gate (Supabase Login) */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: radial-gradient(circle at top, #10284E 0%, #090D16 72%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid rgba(234, 179, 8, 0.35);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }
    .auth-logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.55);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 95;
      background: #1E293B;
      border: 1px solid var(--blue);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .hidden { display: none !important; }
    .muted { color: var(--text-muted); font-size: 12.5px; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(148, 163, 184, 0.14);
      color: #CBD5E1;
    }
  </style>
</head>

      /* =====================================================================
         4. ÉTAT GLOBAL & CLIENT SUPABASE
         ===================================================================== */
      var supabaseConfig = loadSupabaseConfig();
      var supabaseClient = null;
      var realtimeChannel = null;
      var currentUser = null;
      var offlineBypass = false;
      var passwordRecoveryMode = false;
      var syncStatus = "offline";
      var syncErrorMessage = "";
      var saveDebounceTimer = null;

      var sharedState = createDefaultSharedData();
      var localState = loadLocalState();

      function loadSupabaseConfig() {
        try {
          var raw = localStorage.getItem(SB_CFG_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.url && parsed.anonKey) return parsed;
          }
        } catch (e) {}
        return { url: DEFAULT_SUPABASE_CONFIG.url, anonKey: DEFAULT_SUPABASE_CONFIG.anonKey };
      }

      function saveSupabaseConfig(cfg) {
        supabaseConfig = {
          url: (cfg.url || "").trim() || DEFAULT_SUPABASE_CONFIG.url,
          anonKey: (cfg.anonKey || "").trim() || DEFAULT_SUPABASE_CONFIG.anonKey
        };
        try {
          localStorage.setItem(SB_CFG_KEY, JSON.stringify(supabaseConfig));
        } catch (e) {}
      }

      function loadLocalState() {
        var def = createDefaultLocalData();
        try {
          offlineBypass = localStorage.getItem(OFFLINE_MODE_KEY) === "1";
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return def;
          var parsed = JSON.parse(raw);
          if (parsed.sharedFallback) {
            sharedState = Object.assign(createDefaultSharedData(), parsed.sharedFallback);
          }
          if (parsed.local) {
            return Object.assign(def, parsed.local);
          }
        } catch (e) {}
        return def;
      }

      function persistLocalOnly() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            local: localState,
            sharedFallback: sharedState
          }));
        } catch (e) {}
      }

      function isSupabaseConfigured() {
        return Boolean(
          window.supabase &&
          supabaseConfig.url &&
          supabaseConfig.url.indexOf("https://") === 0 &&
          supabaseConfig.anonKey &&
          supabaseConfig.anonKey.length > 15
        );
      }

      function initSupabaseClient() {
        if (!isSupabaseConfigured()) {
          supabaseClient = null;
          syncStatus = "offline";
          return false;
        }
        try {
          supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);
          supabaseClient.auth.onAuthStateChange(function (event, session) {
            if (event === "PASSWORD_RECOVERY") {
              passwordRecoveryMode = true;
              currentUser = session ? session.user : currentUser;
              renderApp();
            }
          });
          return true;
        } catch (e) {
          supabaseClient = null;
          syncStatus = "error";
          syncErrorMessage = e.message || "Erreur initialisation Supabase";
          return false;
        }
      }

      async function pushSharedStateToSupabase() {
        persistLocalOnly();
        if (!supabaseClient || !currentUser) return;
        syncStatus = "syncing";
        updateSyncBadgeUI();

        var author = (currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email || "Formateur";
        sharedState.updatedAt = new Date().toISOString();
        sharedState.updatedBy = author;

        try {
          var res = await supabaseClient
            .from("cellule_etat")
            .upsert({
              id: "ggd85_main",
              data: sharedState,
              updated_at: sharedState.updatedAt,
              updated_by: author
            }, { onConflict: "id" });

          if (res.error) throw res.error;
          syncStatus = "online";
          syncErrorMessage = "";
        } catch (err) {
          syncStatus = "error";
          syncErrorMessage = err.message || "Échec synchro";
        }
        updateSyncBadgeUI();
      }

      function scheduleSharedSync() {
        persistLocalOnly();
        if (saveDebounceTimer) clearTimeout(saveDebounceTimer);
        saveDebounceTimer = setTimeout(function () {
          pushSharedStateToSupabase();
        }, 350);
      }

      async function pullAndSubscribeSupabase() {
        if (!supabaseClient || !currentUser) return;
        syncStatus = "syncing";
        updateSyncBadgeUI();

        try {
          var res = await supabaseClient
            .from("cellule_etat")
            .select("*")
            .eq("id", "ggd85_main")
            .maybeSingle();

          if (res.error) throw res.error;

          if (res.data && res.data.data) {
            sharedState = Object.assign(createDefaultSharedData(), res.data.data);
            persistLocalOnly();
          } else {
            await pushSharedStateToSupabase();
          }

          if (realtimeChannel) {
            supabaseClient.removeChannel(realtimeChannel);
          }

          realtimeChannel = supabaseClient
            .channel("ggd85-cellule-realtime")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "cellule_etat", filter: "id=eq.ggd85_main" },
              function (payload) {
                if (payload.new && payload.new.data) {
                  sharedState = Object.assign(createDefaultSharedData(), payload.new.data);
                  persistLocalOnly();
                  syncStatus = "online";
                  renderApp();
                  showToast("Mise à jour reçue (" + escapeHtml(payload.new.updated_by || "Cellule") + ")");
                }
              }
            )
            .subscribe(function (status) {
              if (status === "SUBSCRIBED") {
                syncStatus = "online";
                updateSyncBadgeUI();
              }
            });

          syncStatus = "online";
          syncErrorMessage = "";
          renderApp();
        } catch (err) {
          syncStatus = "error";
          syncErrorMessage = err.message || "Table cellule_etat inaccessible";
          renderApp();
        }
      }

      function updateSyncBadgeUI() {
        var pill = document.getElementById("header-sync-pill");
        if (!pill) return;
        pill.className = "sync-pill " + (syncStatus === "online" ? "online" : syncStatus === "error" ? "error" : "");
        var label = syncStatus === "online"
          ? "Synchronisé"
          : syncStatus === "syncing"
          ? "Synchro..."
          : syncStatus === "error"
          ? "Erreur synchro"
          : "Mode local";
        pill.innerHTML = '<span class="sync-dot"></span><span>' + label + "</span>";
      }

      function uid(prefix) {
        return (prefix || "id") + "_" + Math.random().toString(36).slice(2, 9);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showToast(msg) {
        var el = document.getElementById("toast-box");
        if (!el) return;
        el.textContent = msg;
        el.classList.remove("hidden");
        clearTimeout(el._t);
        el._t = setTimeout(function () {
          el.classList.add("hidden");
        }, 2600);
      }

          return '<img src="' + escapeHtml(localState.customLogoDataUrl) + '" alt="Rondache GGD85" />';

              ]
            };
            var mBlob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
            var mEl = document.getElementById("dynamic-manifest");
            if (mEl) mEl.href = URL.createObjectURL(mBlob);
          };
          img.src = url;
        } catch (e) {}
      }

      /* =====================================================================
         6. CHRONOMÈTRES MES (BASÉS SUR Date.now() SANS DÉRIVE)
         ===================================================================== */
      function getMesElapsedMs(mes) {
        var base = mes.elapsedMs || 0;
        if (mes.running && mes.startedAt) {
          return base + (Date.now() - mes.startedAt);
        }
        return base;
      }

      function formatDuration(ms) {
        var totalSec = Math.max(0, Math.floor(ms / 1000));
        var mins = Math.floor(totalSec / 60);
        var secs = totalSec % 60;
        return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
      }

      setInterval(function () {
        var displays = document.querySelectorAll("[data-mes-timer]");
        if (!displays.length) return;
        for (var i = 0; i < displays.length; i++) {
          var id = displays[i].getAttribute("data-mes-timer");
          var mes = localState.activeMesList.find(function (m) { return m.id === id; });
          if (mes) {
            displays[i].textContent = formatDuration(getMesElapsedMs(mes));
          }
        }
      }, 250);

      /* =====================================================================
         14. GESTIONNAIRE GLOBAL D'ÉVÉNEMENTS (DÉLÉGATION PROPRE)
         ===================================================================== */
      document.addEventListener("click", async function (e) {
        var target = e.target.closest("[data-action]");
        if (!target) return;
        var action = target.getAttribute("data-action");

        if (action === "close-modal") { closeModal(); return; }
        if (action === "close-modal-backdrop" && e.target === target) { closeModal(); return; }

        if (action === "forgot-password") {
          var emailInput = document.getElementById("login-email");
          var errBox = document.getElementById("login-error");
          var infoBox = document.getElementById("login-info");
          if (errBox) errBox.classList.add("hidden");
          if (infoBox) infoBox.classList.add("hidden");

          var emailVal = emailInput ? emailInput.value.trim() : "";
          if (!emailVal) {
            if (errBox) {
              errBox.textContent = "Saisissez d'abord votre adresse e-mail formateur ci-dessus, puis cliquez sur Mot de passe oublié.";
              errBox.classList.remove("hidden");
            }
            if (emailInput) emailInput.focus();
            return;
          }
          if (!supabaseClient && !initSupabaseClient()) {
            if (errBox) {
              errBox.textContent = "Client Supabase non initialisé.";
              errBox.classList.remove("hidden");
            }
            return;
          }
          var redirectUrl = window.location.origin + window.location.pathname;
          var resetRes = await supabaseClient.auth.resetPasswordForEmail(emailVal, {
            redirectTo: redirectUrl
          });
          if (resetRes.error) {
            if (errBox) {
              errBox.textContent = "Impossible d'envoyer le lien : " + resetRes.error.message;
              errBox.classList.remove("hidden");
            }
          } else if (infoBox) {
            infoBox.textContent = "Un lien de réinitialisation a été envoyé à " + emailVal + " (vérifiez vos courriers indésirables).";
            infoBox.classList.remove("hidden");
          }
          return;
        }

        if (action === "enter-offline-mode") {
          offlineBypass = true;
          try { localStorage.setItem(OFFLINE_MODE_KEY, "1"); } catch (err) {}
          renderApp();
          return;

          renderApp();

        if (action === "toggle-sublot-ready") {

          showAlertModal(target.getAttribute("data-master-id"), target.getAttribute("data-sublot-id"));

          var alId = target.getAttribute("data-alert-id");

          scheduleSharedSync();
          renderApp();
          showToast("Alerte clôturée");
          return;
        }

        if (action === "open-inventory") {
          showInventoryModal(target.getAttribute("data-master-id"), target.getAttribute("data-sublot-id"));
          return;
        }

        if (action === "toggle-inv-item") {
          var mI = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sI = mI && mI.sublots.find(function (s) { return s.id === target.getAttribute("data-sublot-id"); });
          var idxI = parseInt(target.getAttribute("data-idx"), 10);
          if (sI && sI.items[idxI]) {
            sI.items[idxI].ok = !sI.items[idxI].ok;
            scheduleSharedSync();
            renderApp();
          }
          return;
        }

        if (action === "delete-inv-item") {
          var mD = sharedState.masterLots.find(function (m) { return m.id === target.getAttribute("data-master-id"); });
          var sD = mD && mD.sublots.find(function (s) { return s.id === target.getAttribute("data-sublot-id"); });
          var idxD = parseInt(target.getAttribute("data-idx"), 10);
          if (sD) {
            sD.items.splice(idxD, 1);
            scheduleSharedSync();
            showInventoryModal(mD.id, sD.id);

          }

        if (action === "open-site-modal") {
          showSiteModal(target.getAttribute("data-site-id"));
          return;

        /* Pédagogie actions */
        if (action === "switch-ped-subtab") {
          localState.pedSubTab = target.getAttribute("data-subtab");
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "set-course-type") {
          localState.session.courseType = target.getAttribute("data-course");
          if (localState.session.courseType === "PSC") localState.session.trinomeEnabled = false;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "toggle-trinome") {
          localState.session.trinomeEnabled = !localState.session.trinomeEnabled;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "add-learners") {
          var inp = document.getElementById("learner-input");
          if (inp && inp.value.trim()) {
            var names = inp.value.split(/[\n,;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
            localState.session.learners = localState.session.learners.concat(names);
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "remove-learner") {
          var lIdx = parseInt(target.getAttribute("data-idx"), 10);
          localState.session.learners.splice(lIdx, 1);
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "clear-learners") {
          localState.session.learners = [];
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "random-assign-mes") {
          var learners = localState.session.learners.slice();
          if (learners.length === 0) {
            showToast("Ajoutez d'abord les apprenants de la session");
            return;
          }
          for (var i = learners.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = learners[i]; learners[i] = learners[j]; learners[j] = tmp;
          }
          var groupSize = localState.session.courseType === "PSC" ? 1 : (localState.session.trinomeEnabled ? 3 : 2);
          var formatName = groupSize === 1 ? "Solo" : groupSize === 2 ? "Binôme" : "Trinôme";
          var pool = localState.scenarios.filter(function (s) { return s.course === localState.session.courseType || s.course === "TOUS"; });
          if (pool.length === 0) pool = localState.scenarios.slice();

          var created = [];
          for (var g = 0; g < learners.length; g += groupSize) {
            var grp = learners.slice(g, g + groupSize);
            var scPick = pool[(created.length) % pool.length];
            created.push({
              id: uid("mes"),
              format: grp.length === 1 ? "Solo" : grp.length === 2 ? "Binôme" : formatName,
              learners: grp,
              scenarioTitle: scPick ? scPick.title : "Mise en situation",
              scenarioContext: scPick ? scPick.context : "",
              elapsedMs: 0,
              running: false,
              startedAt: null,
              observations: "",
              actions: "",
              positives: "",
              improvements: "",
              debrief: ""
            });
          }
          localState.activeMesList = created;
          localState.selectedMesId = created[0].id;
          localState.pedSubTab = "conduite";
          persistLocalOnly();
          renderApp();
          showToast(created.length + " mise(s) en situation générée(s)");
          return;
        }

        if (action === "launch-scenario") {
          var scId = target.getAttribute("data-scenario-id");
          var scObj = localState.scenarios.find(function (s) { return s.id === scId; });
          if (!scObj) return;
          var newMes = {
            id: uid("mes"),
            format: localState.session.courseType,
            learners: localState.session.learners.slice(0, localState.session.courseType === "PSC" ? 1 : 2),
            scenarioTitle: scObj.title,
            scenarioContext: scObj.context,
            elapsedMs: 0,
            running: false,
            startedAt: null,
            observations: "",
            actions: "",
            positives: "",
            improvements: "",
            debrief: ""
          };
          localState.activeMesList.push(newMes);
          localState.selectedMesId = newMes.id;
          localState.pedSubTab = "conduite";
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "select-mes") {
          localState.selectedMesId = target.getAttribute("data-mes-id");
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "toggle-mes-timer") {
          var mesT = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesT) {
            if (mesT.running) {
              mesT.elapsedMs = getMesElapsedMs(mesT);
              mesT.running = false;
              mesT.startedAt = null;
            } else {
              mesT.running = true;
              mesT.startedAt = Date.now();
            }
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "reset-mes-timer") {
          var mesR = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesR) {
            mesR.elapsedMs = 0;
            mesR.running = false;
            mesR.startedAt = null;
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "stamp-mes-step") {
          var mesS = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesS) {
            var stamp = "[" + formatDuration(getMesElapsedMs(mesS)) + "] " + target.getAttribute("data-step-label");
            mesS.actions = (mesS.actions ? mesS.actions.trim() + "\n" : "") + stamp;
            persistLocalOnly();
            renderApp();
            showToast("Top Chrono : " + stamp);
          }
          return;
        }

        if (action === "open-mes-steps-modal") {
          showMesStepsModal(target.getAttribute("data-mes-id"));
          return;
        }

        if (action === "copy-mes-summary") {
          var mesC = localState.activeMesList.find(function (m) { return m.id === target.getAttribute("data-mes-id"); });
          if (mesC) {
            var txt = [
              "BILAN MES — CELLULE SECOURISME GGD85",
              "Scénario : " + mesC.scenarioTitle,
              "Apprenant(s) : " + ((mesC.learners || []).join(", ") || "N/C"),
              "Durée : " + formatDuration(getMesElapsedMs(mesC)),
              "Observations : " + (mesC.observations || "-"),
              "Actions réalisées :\n" + (mesC.actions || "-"),
              "Points positifs : " + (mesC.positives || "-"),
              "Points à reprendre : " + (mesC.improvements || "-"),
              "Débriefing : " + (mesC.debrief || "-")
            ].join("\n");
            if (navigator.clipboard) navigator.clipboard.writeText(txt);
            showToast("Bilan MES copié dans le presse-papiers");
          }
          return;
        }

        if (action === "archive-mes") {
          var idA = target.getAttribute("data-mes-id");
          var idxA = localState.activeMesList.findIndex(function (m) { return m.id === idA; });
          if (idxA !== -1) {
            var mA = localState.activeMesList[idxA];
            localState.mesHistory.unshift({
              id: mA.id,
              scenarioTitle: mA.scenarioTitle,
              learners: mA.learners,
              duration: formatDuration(getMesElapsedMs(mA)),
              debrief: mA.debrief,
              archivedAt: new Date().toLocaleDateString("fr-FR")
            });
            localState.activeMesList.splice(idxA, 1);
            localState.selectedMesId = localState.activeMesList[0] ? localState.activeMesList[0].id : null;
            persistLocalOnly();
            renderApp();
            showToast("MES archivée");
          }
          return;
        }

        if (action === "delete-mes") {
          var idDel = target.getAttribute("data-mes-id");
          localState.activeMesList = localState.activeMesList.filter(function (m) { return m.id !== idDel; });
          localState.selectedMesId = localState.activeMesList[0] ? localState.activeMesList[0].id : null;
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "copy-history-item") {
          var hItem = localState.mesHistory.find(function (h) { return h.id === target.getAttribute("data-hist-id"); });
          if (hItem && navigator.clipboard) {
            navigator.clipboard.writeText(hItem.scenarioTitle + " (" + hItem.duration + ") — " + (hItem.learners || []).join(", ") + "\n" + (hItem.debrief || ""));
            showToast("Archive copiée");
          }
          return;
        }

        if (action === "open-scenario-modal") {
          showScenarioModal(target.getAttribute("data-scenario-id"));
          return;
        }

        if (action === "delete-scenario") {
          var scDelId = target.getAttribute("data-scenario-id");
          localState.scenarios = localState.scenarios.filter(function (s) { return s.id !== scDelId; });
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "add-keystep") {
          var ksInp = document.getElementById("new-keystep-input");
          if (ksInp && ksInp.value.trim()) {
            localState.keySteps.push({ id: uid("ks"), label: ksInp.value.trim() });
            persistLocalOnly();
            renderApp();
          }
          return;
        }

        if (action === "remove-keystep") {
          var ksId = target.getAttribute("data-ks-id");
          localState.keySteps = localState.keySteps.filter(function (k) { return k.id !== ksId; });
          persistLocalOnly();
          renderApp();
          return;
        }

        if (action === "reset-logo") {
          localState.customLogoDataUrl = "";
          persistLocalOnly();
          setupPwaAssets();
          renderApp();
          return;
        }

        if (action === "export-json") {
          var blob = new Blob([JSON.stringify({ shared: sharedState, local: localState }, null, 2)], { type: "application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "sauvegarde-cellule-secourisme-ggd85.json";
          a.click();
          return;
        }
      });

      /* Sauvegarde temps réel des notes MES sans perte de focus */
      document.addEventListener("input", function (e) {
        var field = e.target.getAttribute("data-mes-field");
        if (!field) return;
        var mesId = e.target.getAttribute("data-mes-id");
        var mes = localState.activeMesList.find(function (m) { return m.id === mesId; });
        if (mes) {
          mes[field] = e.target.value;
          persistLocalOnly();
        }
      });

      /* Mise à jour dynamique du sélecteur de sous-lot dans la modale alerte */
      document.addEventListener("change", function (e) {
        if (e.target && e.target.id === "alert-master-select") {
          var m = sharedState.masterLots.find(function (x) { return x.id === e.target.value; });
          var subSel = document.getElementById("alert-sublot-select");
          if (m && subSel) {
            subSel.innerHTML = (m.sublots || []).map(function (s) {
              return '<option value="' + escapeHtml(s.id) + '">' + escapeHtml(s.name) + "</option>";
            }).join("") || '<option value="">Lot général</option>';
          }
        }

        if (e.target && e.target.id === "logo-file-input" && e.target.files && e.target.files[0]) {
          var reader = new FileReader();
          reader.onload = function (ev) {
            localState.customLogoDataUrl = ev.target.result;
            persistLocalOnly();
            setupPwaAssets();
            renderApp();
            showToast("Rondache personnalisée appliquée");
          };
          reader.readAsDataURL(e.target.files[0]);
        }

        if (e.target && e.target.id === "import-json-input" && e.target.files && e.target.files[0]) {
          var rJson = new FileReader();
          rJson.onload = function (ev) {
            try {
              var imported = JSON.parse(ev.target.result);
              if (imported.shared) sharedState = Object.assign(createDefaultSharedData(), imported.shared);
              if (imported.local) localState = Object.assign(createDefaultLocalData(), imported.local);
              scheduleSharedSync();
              renderApp();
              showToast("Sauvegarde importée");
            } catch (err) {
              showToast("Fichier JSON invalide");
            }
          };
          rJson.readAsText(e.target.files[0]);
        }
      });

      /* Soumission des formulaires */
      document.addEventListener("submit", async function (e) {
        var form = e.target;
        if (!form || !form.id) return;
        e.preventDefault();

        if (form.id === "supabase-new-password-form") {
          var p1 = document.getElementById("new-pass-1").value;
          var p2 = document.getElementById("new-pass-2").value;
          var recErr = document.getElementById("recovery-error");
          if (p1 !== p2) {
            recErr.textContent = "Les deux mots de passe ne correspondent pas.";
            recErr.classList.remove("hidden");
            return;
          }
          var updRes = await supabaseClient.auth.updateUser({ password: p1 });
          if (updRes.error) {
            recErr.textContent = "Erreur : " + updRes.error.message;
            recErr.classList.remove("hidden");
            return;
          }
          passwordRecoveryMode = false;
          currentUser = updRes.data.user;
          showToast("Mot de passe mis à jour");
          await pullAndSubscribeSupabase();
          return;
        }

        if (form.id === "supabase-quick-cfg-form") {
          var uEl = form.querySelector("input[type='url']");
          var kEl = form.querySelector("input[type='text']");
          saveSupabaseConfig({ url: uEl.value, anonKey: kEl.value });
          initSupabaseClient();
          closeModal();
          showToast("Configuration Supabase enregistrée");
          renderApp();
          return;
        }

        if (form.id === "supabase-login-form") {
          var email = document.getElementById("login-email").value.trim();
          var pass = document.getElementById("login-pass").value;
          var errBox = document.getElementById("login-error");
          if (!supabaseClient && !initSupabaseClient()) {
            errBox.textContent = "Client Supabase non initialisé.";
            errBox.classList.remove("hidden");
            return;
          }
          var authRes = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
          if (authRes.error) {
            errBox.textContent = "Connexion refusée : " + authRes.error.message;
            errBox.classList.remove("hidden");
            return;
          }
          currentUser = authRes.data.user;
          offlineBypass = false;
          try { localStorage.removeItem(OFFLINE_MODE_KEY); } catch (err) {}
          await pullAndSubscribeSupabase();
          return;
        }

        if (form.id === "alert-form") {
          var mId = document.getElementById("alert-master-select").value;
          var sId = document.getElementById("alert-sublot-select").value;
          var type = document.getElementById("alert-type-select").value;
          var detail = document.getElementById("alert-detail-input").value.trim();
          var markInc = document.getElementById("alert-mark-incomplete").checked;

          var mObj = sharedState.masterLots.find(function (m) { return m.id === mId; });
          var sObj = mObj && mObj.sublots.find(function (s) { return s.id === sId; });
          var label = (mObj ? mObj.name : "") + (sObj ? " — " + sObj.name : "");
          var author = (currentUser && ((currentUser.user_metadata && currentUser.user_metadata.full_name) || currentUser.email)) || "Formateur";

          sharedState.alerts.unshift({
            id: uid("al"),
            masterId: mId,
            sublotId: sId,
            lotLabel: label,
            type: type,
            detail: detail,
            author: author,
            createdAt: new Date().toISOString()
          });

          if (markInc && sObj) sObj.ready = false;
          closeModal();
          scheduleSharedSync();
          renderApp();
          showToast("Signalement enregistré");
          return;
        }

        if (form.id === "reserve-form") {
          var mR = sharedState.masterLots.find(function (m) { return m.id === form.getAttribute("data-master-id"); });
          var sR = mR && mR.sublots.find(function (s) { return s.id === form.getAttribute("data-sublot-id"); });
          if (sR) {
            sR.reserved = true;
            sR.reservedBy = document.getElementById("res-by").value.trim();
            sR.reservedDates = document.getElementById("res-dates").value.trim();
            closeModal();
            scheduleSharedSync();
            renderApp();
            showToast("Sous-lot réservé");
          }
          return;
        }

        if (form.id === "add-sublot-form") {
          var mA = sharedState.masterLots.find(function (m) { return m.id === form.getAttribute("data-master-id"); });
          var nameA = document.getElementById("new-sublot-name").value.trim();
          if (mA && nameA) {
            mA.sublots.push({
              id: uid("sub"),
              name: nameA,
              ready: true,
              reserved: false,
              reservedBy: "",
              reservedDates: "",
              items: []
            });
            mA.comingSoon = false;
            closeModal();
            scheduleSharedSync();
            renderApp();
          }
          return;
        }

        if (form.id === "add-inv-form") {
          var mInv = sharedState.masterLots.find(function (m) { return m.id === form.getAttribute("data-master-id"); });
          var sInv = mInv && mInv.sublots.find(function (s) { return s.id === form.getAttribute("data-sublot-id"); });
          var nInv = document.getElementById("inv-new-name").value.trim();
          var qInv = parseInt(document.getElementById("inv-new-qty").value, 10) || 1;
          if (sInv && nInv) {
            sInv.items.push({ id: uid("it"), name: nInv, qty: qInv, ok: true });
            scheduleSharedSync();
            showInventoryModal(mInv.id, sInv.id);
            renderApp();
          }
          return;
        }

        if (form.id === "site-form") {
          var editSiteId = form.getAttribute("data-site-id");
          var payloadSite = {
            id: editSiteId || uid("site"),
            name: document.getElementById("site-name").value.trim(),
            keys: document.getElementById("site-keys").value.trim(),
            location: document.getElementById("site-location").value.trim(),
            storage: document.getElementById("site-storage").value.trim(),
            notes: document.getElementById("site-notes").value.trim()
          };
          if (editSiteId) {
            var idxS = sharedState.sites.findIndex(function (s) { return s.id === editSiteId; });
            if (idxS !== -1) sharedState.sites[idxS] = payloadSite;
          } else {
            sharedState.sites.push(payloadSite);
          }
          closeModal();
          scheduleSharedSync();
          renderApp();
          return;
        }

        if (form.id === "scenario-form") {
          var editScId = form.getAttribute("data-scenario-id");
          var scPayload = {
            id: editScId || uid("sc"),
            title: document.getElementById("sc-title").value.trim(),
            course: document.getElementById("sc-course").value,
            formats: ["Solo", "Binôme", "Trinôme"],
            context: document.getElementById("sc-context").value.trim()
          };
          if (editScId) {
            var idxSc = localState.scenarios.findIndex(function (s) { return s.id === editScId; });
            if (idxSc !== -1) localState.scenarios[idxSc] = scPayload;
          } else {
            localState.scenarios.unshift(scPayload);
          }
          closeModal();
          persistLocalOnly();
          renderApp();
          return;
        }

        if (form.id === "mes-steps-form") {
          var mesId = form.getAttribute("data-mes-id");
          var mes = localState.activeMesList.find(function (m) { return m.id === mesId; });
          if (mes) {
            var checks = form.querySelectorAll(".mes-step-chk:checked");
            mes.selectedStepIds = Array.prototype.map.call(checks, function (c) { return c.value; });
            closeModal();
            persistLocalOnly();
            renderApp();
          }
          return;
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeModal();
      });

      /* =====================================================================
         15. INITIALISATION AU DÉMARRAGE
         ===================================================================== */
      async function bootstrap() {
        setupPwaAssets();
        if (initSupabaseClient()) {
          try {
            var sessRes = await supabaseClient.auth.getSession();
            if (sessRes.data && sessRes.data.session && sessRes.data.session.user) {
              currentUser = sessRes.data.session.user;
              await pullAndSubscribeSupabase();
              return;
            }
          } catch (e) {}
        }
        renderApp();
      }

      bootstrap();
    })();
  </script>
</body>
</html>
